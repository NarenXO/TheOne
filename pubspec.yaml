name: theone
description: Offline Evidence-First Multimodal Accessibility Assistant
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  flutter_tts: ^3.8.5
  camera: ^0.11.0+2
  google_mlkit_commons: ^0.8.0
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_object_detection: ^0.13.0
  vibration: ^2.0.0
  speech_to_text: ^7.0.0
  torch_light: ^1.0.0
  battery_plus: ^6.0.0
  geolocator: ^13.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/phrases.json
    - assets/data/signs.json