name: Build Hearing Assist APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:3.24.0-stable
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --debug -t lib/hearing_preview.dart --no-tree-shake-icons
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HearingAssist-Demo-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
